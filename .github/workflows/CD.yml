name: CD with Gradle

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout With Submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Jar
        run: ./gradlew clean bootJar -Dspring.profiles.active=prod

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker build and push (latest & sha)
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}"
          docker build -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA} .
          docker push $IMAGE:latest
          docker push $IMAGE:${GITHUB_SHA}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout for infra
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Debug infra files (sanity check)
        run: |
          echo "[DEBUG] pwd=$(pwd)"
          ls -al .
          echo "----- infra -----"
          ls -alR ./infra || echo "NO infra DIR"

      - name: Upload infra to Bastion
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          source: "infra"
          target: "~"
          overwrite: true

      - name: Prepare on Bastion (chmod)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ls -al ~/infra
            chmod +x ~/infra/scripts/*.sh
            ls -al ~/infra/scripts

      - name: Deploy via Bastion to App EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            PEM_KEY_PATH="$HOME/.ssh/teumteum.pem"
            chmod 600 "$PEM_KEY_PATH"

            scp -o StrictHostKeyChecking=no -i "$PEM_KEY_PATH" -r ~/infra ubuntu@${{ secrets.APP_EC2_PRIVATE_IP }}:/home/ubuntu/

            ssh -o StrictHostKeyChecking=no -i "$PEM_KEY_PATH" ubuntu@${{ secrets.APP_EC2_PRIVATE_IP }} \
              "chmod +x /home/ubuntu/infra/scripts/*.sh && \
               export REGION='${{ secrets.AWS_REGION }}' \
               DOMAIN='${{ secrets.GRAFANA_DOMAIN }}' \
               GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}' \
               IMAGE='${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }}' \
               SPRINGBOOT_PORT='${{ secrets.SPRINGBOOT_PORT }}' \
               REDIS_VERSION='${{ secrets.REDIS_VERSION }}' \
               REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
               DB_URL='${{ secrets.DB_URL }}' \
               DB_USERNAME='${{ secrets.DB_USERNAME }}' \
               DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
               AWS_ACCESS_KEY='${{ secrets.AWS_ACCESS_KEY }}' \
               AWS_SECRET_KEY='${{ secrets.AWS_SECRET_KEY }}' \
               S3_BUCKET='${{ secrets.S3_BUCKET }}' \
               S3_PREFIX='${{ secrets.S3_PREFIX }}' \
               FIREBASE_CREDENTIALS_BASE64='${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}' \
               GOOGLE_APPLICATION_CREDENTIALS='${{ secrets.FIREBASE_CREDENTIAL_PATH }}' \
               OPEN_API_KEY_B64='${{ secrets.OPEN_API_KEY }}' \
               ENABLE_CLOUDWATCH='${{ secrets.ENABLE_CLOUDWATCH }}' \
               ENABLE_PROMETHEUS='${{ secrets.ENABLE_PROMETHEUS }}' \
               ENABLE_GRAFANA='${{ secrets.ENABLE_GRAFANA }}' \
               && bash /home/ubuntu/infra/scripts/run_all.sh"




