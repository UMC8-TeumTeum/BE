name: CD with Gradle

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout With Submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Update Git Submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Jar
        run: ./gradlew clean bootJar -Dspring.profiles.active=prod

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker build and push ( latest & sha )
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload infra to Bastion
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          source: "infra/**"
          target: "~/deploy"

      - name: Deploy via Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail

            APP_KEY_FILE="$HOME/app_ec2.pem"
            printf "%s" "${{ secrets.APP_EC2_PRIVATE_KEY }}" > "$APP_KEY_FILE"
            chmod 600 "$APP_KEY_FILE"
            
            rsync -az -e "ssh -o StrictHostKeyChecking=no -i $APP_KEY_FILE" \
            ~/deploy/ ubuntu@${{ secrets.APP_EC2_PRIVATE_IP }}:/home/ubuntu/deploy/

            ssh -o StrictHostKeyChecking=no -i "$APP_KEY_FILE" ubuntu@${{ secrets.APP_EC2_PRIVATE_IP }} << 'EOF'
            set -Eeuo pipefail

            export REGION="${{ secrets.AWS_REGION }}"
            export DOMAIN="${{ secrets.GRAFANA_DOMAIN }}"
            export GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
            export IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }}"
            export SPRINGBOOT_PORT="${{ secrets.SPRINGBOOT_PORT }}"
            export REDIS_VERSION="${{ secrets.REDIS_VERSION }}"
            export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export AWS_ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY }}"
            export AWS_SECRET_KEY="${{ secrets.AWS_SECRET_KEY }}"
            export S3_BUCKET="${{ secrets.S3_BUCKET }}"
            export S3_PREFIX="${{ secrets.S3_PREFIX }}"
            export FIREBASE_CREDENTIALS_BASE64="${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}"
            export OPEN_API_KEY_B64="${{ secrets.OPEN_API_KEY }}" 


            export ENABLE_CLOUDWATCH="${{ secrets.ENABLE_CLOUDWATCH }}"
            export ENABLE_PROMETHEUS="${{ secrets.ENABLE_PROMETHEUS }}"
            export ENABLE_GRAFANA="${{ secrets.ENABLE_GRAFANA }}"   

            bash /home/ubuntu/deploy/infra/scripts/run_all.sh
            EOF



      - name: Notify on Discord(Success)
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            서버 배포 성공
            • Repo: `${{ github.repository }}`
            • Branch: `${{ github.ref_name }}`
            • Commit: `${{ github.sha }}`
            • Docker Image: `${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }}`



      - name: Notify on Discord(Fail)
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            서버 배포 실패
            • Repo: `${{ github.repository }}`
            • Branch: `${{ github.ref_name }}`
            • Commit: `${{ github.sha }}`
            • [Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

