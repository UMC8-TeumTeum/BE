name: CD with Gradle (ECR + OIDC)

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ECR_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO_NAME }}

    steps:
      - name: Checkout With Submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker pull cache image
        run: |
          docker pull ${ECR_URI}:latest || true

      - name: Docker build and push (latest & sha)
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-10)
          
          DOCKER_BUILDKIT=1 BUILDKIT_INLINE_CACHE=1 docker build \
            --cache-from ${ECR_URI}:latest \
            -t ${ECR_URI}:latest \
            -t ${ECR_URI}:develop-${SHORT_SHA} \
            .

          docker push ${ECR_URI}:latest
          docker push ${ECR_URI}:develop-${SHORT_SHA}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ssm-deploy-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-10)
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Service,Values=teumteum-app" \
            --comment "Deploy teum-teum ${SHORT_SHA}" \
            --parameters 'commands=["/opt/teumteum/scripts/deploy.sh"]'